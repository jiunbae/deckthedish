<!doctype html>

<meta property="og:title" content="주방덱 · Deck the Dish · キッチンデッキ">
<meta property="og:description" content="A cozy deckbuilding cooking roguelike: run Grandma's neighborhood restaurant one card at a time.">
<meta property="og:image" content="https://jiun.dev/deckthedish/assets/og.jpg">
<meta name="theme-color" content="#2a1e17">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="./"><img src="assets/icon-192.png" alt=""><span data-i18n="brand">주방덱</span></a>
    <nav>
      <a href="./#features" data-i18n="nav.features">특징</a>
      <a href="support.html" data-i18n="nav.support">지원</a>
      <a href="privacy.html" data-i18n="nav.privacy">개인정보 처리방침</a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="hero" style="--hero-img: url('assets/hero.jpg')">
    <div class="wrap">
      <div>
        <h1 class="wordmark"><img data-wordmark src="assets/wordmark_ko.png" alt="주방덱 — 카드로 차리는 동네 식당"></h1>
        <p class="lead" data-i18n="hero.lead">할머니의 작은 식당을 맡은 첫 하루.</p>
        <div class="cta">
          <a class="btn primary" href="play/" data-i18n="hero.play">브라우저에서 플레이</a>
          <a class="btn ghost" href="https://apps.apple.com/app/id6821381387" data-i18n="hero.ios">App Store에서 받기</a>
        </div>
      </div>
      <div class="phone"><img data-shot="kitchen" src="shots/ko/kitchen.jpg" alt="Kitchen screen"></div>
    </div>
  </div>

  <section id="features">
    <div class="wrap">
      <h2 data-i18n="features.title">한 판 20분, 매번 다른 주방</h2>
      <p class="sub" data-i18n="features.sub"></p>
      <div class="features">
        <article class="feature">
          <div class="icon"><img src="assets/f-cook.jpg" alt=""></div>
          <h3 data-i18n="f1.title"></h3><p data-i18n="f1.text"></p>
        </article>
        <article class="feature">
          <div class="icon"><img src="assets/f-customer.jpg" alt=""></div>
          <h3 data-i18n="f2.title"></h3><p data-i18n="f2.text"></p>
        </article>
        <article class="feature">
          <div class="icon"><img src="assets/f-grow.jpg" alt=""></div>
          <h3 data-i18n="f3.title"></h3><p data-i18n="f3.text"></p>
        </article>
        <article class="feature">
          <div class="icon"><img src="assets/f-story.jpg" alt=""></div>
          <h3 data-i18n="f4.title"></h3><p data-i18n="f4.text"></p>
        </article>
      </div>
    </div>
  </section>

  <section class="shots">
    <div class="wrap">
      <h2 data-i18n="shots.title">스크린샷</h2>
      <p class="sub" data-i18n="shots.sub"></p>
      <div class="shot-row">
        <figure><img data-shot="title" src="shots/ko/title.jpg" alt="" loading="lazy"><figcaption data-i18n="shot.1"></figcaption></figure>
        <figure><img data-shot="deck" src="shots/ko/deck.jpg" alt="" loading="lazy"><figcaption data-i18n="shot.2"></figcaption></figure>
        <figure><img data-shot="kitchen" src="shots/ko/kitchen.jpg" alt="" loading="lazy"><figcaption data-i18n="shot.3"></figcaption></figure>
        <figure><img data-shot="reward" src="shots/ko/reward.jpg" alt="" loading="lazy"><figcaption data-i18n="shot.4"></figcaption></figure>
        <figure><img data-shot="shop" src="shots/ko/shop.jpg" alt="" loading="lazy"><figcaption data-i18n="shot.5"></figcaption></figure>
      </div>
    </div>
  </section>

  <section id="how" class="how">
    <div class="wrap">
      <h2 data-i18n="how.title">플레이 방법</h2>
      <ol>
        <li data-i18n="how.1"></li>
        <li data-i18n="how.2"></li>
        <li data-i18n="how.3"></li>
        <li data-i18n="how.4"></li>
        <li data-i18n="how.5"></li>
      </ol>
    </div>
  </section>

  <section id="info">
    <div class="wrap">
      <h2 data-i18n="info.title">안내</h2>
      <div class="info">
        <div class="card">
          <h3 data-i18n="info.privacy.title"></h3>
          <p data-i18n="info.privacy.text"></p>
          <a href="privacy.html" data-i18n="info.privacy.link"></a>
        </div>
        <div class="card" id="support">
          <h3 data-i18n="info.support.title"></h3>
          <p data-i18n="info.support.text"></p>
          <a href="support.html" data-i18n="info.support.link"></a>
        </div>
        <div class="card">
          <h3 data-i18n="info.lang.title"></h3>
          <p data-i18n="info.lang.text"></p>
        </div>
      </div>
    </div>
  </section>

      <a href="licenses.html" data-i18n="nav.licenses">오픈소스 라이선스</a>
    </span>
    <span class="credits" data-i18n="footer.credits"></span>
  </div>
</footer>
</body>
</html>
